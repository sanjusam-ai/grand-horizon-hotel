<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings | Admin Panel</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style type="text/tailwindcss">
    @theme {
      --color-navy: #0F2942;
      --color-navy-dark: #091B2C;
      --font-serif: "Playfair Display", Georgia, serif;
      --font-sans: "Plus Jakarta Sans", system-ui, sans-serif;
    }
  </style>
</head>
<body class="font-sans text-slate-800 bg-slate-100 antialiased">

  <div class="min-h-screen flex flex-col md:flex-row">

    <!-- SHARED ADMIN LEFT SIDEBAR -->
    <aside class="w-full md:w-64 bg-navy text-white flex flex-col justify-between shrink-0">
      <div>
        <div class="p-6 border-b border-slate-700/70">
          <a href="../index.html" class="font-serif text-2xl font-bold tracking-wide">
            Grand <span class="text-amber-400">Horizon</span>
          </a>
          <p class="text-[11px] uppercase tracking-widest text-slate-400 mt-1">Admin Control Panel</p>
        </div>

        <nav class="p-4 space-y-1.5 text-sm font-medium">
          <a href="dashboard.html" class="flex items-center gap-3 text-slate-300 hover:bg-navy-dark hover:text-white px-4 py-2.5 rounded-lg transition">
            <span>📊</span> Dashboard
          </a>
          <a href="rooms.html" class="flex items-center gap-3 text-slate-300 hover:bg-navy-dark hover:text-white px-4 py-2.5 rounded-lg transition">
            <span>🛏️</span> Manage Rooms
          </a>
          <a href="bookings.html" class="flex items-center gap-3 text-slate-300 hover:bg-navy-dark hover:text-white px-4 py-2.5 rounded-lg transition">
            <span>📅</span> Bookings
          </a>
          <a href="messages.html" class="flex items-center gap-3 text-slate-300 hover:bg-navy-dark hover:text-white px-4 py-2.5 rounded-lg transition">
            <span>✉️</span> Contact Messages
          </a>
          <a href="settings.html" class="flex items-center gap-3 bg-blue-600 text-white px-4 py-2.5 rounded-lg shadow-sm">
            <span>⚙️</span> Settings
          </a>
        </nav>
      </div>

      <div class="p-4 border-t border-slate-700/70">
        <a href="../index.html" class="block text-center bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold py-2.5 rounded-lg transition">
          ← Back to Website
        </a>
      </div>
    </aside>

    <!-- MAIN WORKSPACE -->
    <main class="flex-1 p-6 md:p-8">
      <div class="mb-8">
        <h1 class="text-2xl font-bold text-navy">System Settings</h1>
        <p class="text-xs text-slate-500 mt-0.5">Update hotel contact details and administrator preferences</p>
      </div>

      <form onsubmit="saveAdminSettings(event)" class="max-w-3xl space-y-6">

        <!-- CARD 1: GENERAL SETTINGS (Matches Top Section of 10th Wireframe) -->
        <div class="bg-white p-6 rounded-2xl shadow-xs border border-slate-200 space-y-4 text-sm">
          <h2 class="font-bold text-navy text-base border-b border-slate-100 pb-3">General Settings</h2>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block font-medium text-slate-700 mb-1">Hotel Name</label>
              <input type="text" value="Grand Horizon Hotel" class="w-full border border-slate-300 rounded-lg px-3.5 py-2 focus:outline-none focus:border-blue-600">
            </div>
            <div>
              <label class="block font-medium text-slate-700 mb-1">Official Email</label>
              <input type="email" value="reservations@grandhorizon.com" class="w-full border border-slate-300 rounded-lg px-3.5 py-2 focus:outline-none focus:border-blue-600">
            </div>
            <div>
              <label class="block font-medium text-slate-700 mb-1">Front Desk Phone</label>
              <input type="text" value="+91 98765 43210" class="w-full border border-slate-300 rounded-lg px-3.5 py-2 focus:outline-none focus:border-blue-600">
            </div>
            <div>
              <label class="block font-medium text-slate-700 mb-1">Location Address</label>
              <input type="text" value="120 Oceanfront Boulevard, Marine Drive" class="w-full border border-slate-300 rounded-lg px-3.5 py-2 focus:outline-none focus:border-blue-600">
            </div>
          </div>
        </div>

        <!-- CARD 2: ADMIN SETTINGS (Matches Bottom Section of 10th Wireframe) -->
        <div class="bg-white p-6 rounded-2xl shadow-xs border border-slate-200 space-y-4 text-sm">
          <h2 class="font-bold text-navy text-base border-b border-slate-100 pb-3">Admin Settings</h2>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block font-medium text-slate-700 mb-1">Admin Username</label>
              <input type="text" value="Sanju_Admin" class="w-full border border-slate-300 rounded-lg px-3.5 py-2 focus:outline-none focus:border-blue-600">
            </div>
            <div>
              <label class="block font-medium text-slate-700 mb-1">Change Password</label>
              <input type="password" placeholder="••••••••" class="w-full border border-slate-300 rounded-lg px-3.5 py-2 focus:outline-none focus:border-blue-600">
            </div>
          </div>

          <div class="pt-2 space-y-2.5">
            <label class="flex items-center gap-3 cursor-pointer">
              <input type="checkbox" checked class="accent-blue-600 w-4 h-4">
              <span class="text-slate-700">Receive email alerts for new room bookings</span>
            </label>
            <label class="flex items-center gap-3 cursor-pointer">
              <input type="checkbox" checked class="accent-blue-600 w-4 h-4">
              <span class="text-slate-700">Enable instant website reservation confirmations</span>
            </label>
          </div>
        </div>

        <div class="flex justify-end">
          <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-7 py-2.5 rounded-lg shadow-sm transition cursor-pointer">
            Save Changes
          </button>
        </div>

      </form>
    </main>
  </div>

  <script>
    function saveAdminSettings(e) {
      e.preventDefault();
      alert('Settings saved successfully!');
    }
  </script>

</body>
</html>
